name: HoyoLab Auto Check-in & Redeem

on:
  schedule:
    # Runs daily at 17:00 UTC (00:00 WIB / 01:00 WITA)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  hoyolab-auto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Configuration
        env:
          HOYOLAB_COOKIE: ${{ secrets.HOYOLAB_COOKIE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node generate-config.js

      - name: Run HoyoLab Auto Execution
        run: node run-once.js
